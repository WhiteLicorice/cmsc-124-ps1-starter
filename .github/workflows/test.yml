name: ps1-checks
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: chmod +x build.sh run check.sh
      # check.sh is the whole grade. It builds, runs the published corpus, and
      # runs it again under AddressSanitizer and UndefinedBehaviorSanitizer,
      # which do link here even though they do not on MSYS2.
      - run: ./check.sh
